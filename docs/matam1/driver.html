<!DOCTYPE html>

<head>

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700&display=swap" rel="stylesheet">
  <style>/* قائمة المأكولات للزبون — موبايل */
.customer-menu-body {
  margin: 0;
  min-height: 100vh;
  font-family: Tajawal, Tahoma, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  color: #1a1a1a;
  background: linear-gradient(180deg, #eef4fb 0%, #f8fafc 40%, #fff 100%);
  -webkit-font-smoothing: antialiased;
}

.customer-menu-header {
  padding: 14px 12px 12px;
  background: linear-gradient(135deg, #0d1b2a 0%, #1b3a5c 100%);
  color: #fff;
  box-shadow: 0 4px 20px rgba(13, 27, 42, 0.25);
}

.customer-menu-header-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.customer-menu-back-btn,
.customer-menu-lang-btn {
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 700;
  line-height: 1;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.45);
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.customer-menu-back-btn {
  display: inline-flex;
  align-items: center;
}

.customer-menu-back-btn:hover,
.customer-menu-lang-btn:hover {
  background: rgba(255, 255, 255, 0.24);
  border-color: rgba(255, 255, 255, 0.65);
}

.customer-menu-header-actions .customer-menu-lang-btn {
  margin-inline-start: auto;
}

.customer-menu-subtitle {
  margin: 0;
  font-size: 0.82rem;
  font-weight: 600;
  opacity: 0.88;
}

.customer-menu-body--en .customer-menu-meta {
  align-items: flex-start;
  text-align: start;
}

.customer-menu-header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 14px;
}

.customer-menu-brand {
  flex-shrink: 0;
}

.customer-menu-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  text-align: start;
}

.customer-menu-logo {
  width: 72px;
  height: 72px;
  object-fit: contain;
  border-radius: 16px;
  background: #fff;
  padding: 5px;
  display: block;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
}

.customer-menu-header h1 {
  margin: 0;
  font-size: 1.2rem;
  font-weight: 700;
  line-height: 1.3;
  word-break: break-word;
}

.customer-menu-stars {
  display: flex;
  justify-content: flex-start;
  gap: 3px;
  margin-top: 2px;
}

.customer-menu-star {
  font-size: 1.1rem;
  color: rgba(255, 255, 255, 0.28);
  line-height: 1;
}

.customer-menu-star.is-filled {
  color: #f5c542;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
}

.customer-menu-phone {
  margin: 0;
  font-size: 0.92rem;
  font-weight: 600;
  opacity: 0.92;
  direction: ltr;
  text-align: start;
}

.customer-menu-address {
  margin: 0;
  font-size: 0.88rem;
  font-weight: 500;
  opacity: 0.88;
  line-height: 1.45;
}

.customer-menu-cat-nav {
  display: block;
  width: 100%;
  min-height: 46px;
  margin-top: 2px;
  padding-top: 10px;
  border-top: 1px solid rgba(255, 255, 255, 0.16);
}

.customer-menu-cat-nav-scroll {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 40px;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;

  scrollbar-color: rgba(255, 255, 255, 0.35) transparent;

}

.customer-menu-cat-nav-scroll::-webkit-scrollbar {

}

.customer-menu-cat-nav-scroll::-webkit-scrollbar-thumb {

}

.customer-menu-cat-nav-scroll::-webkit-scrollbar-track {

}

.customer-menu-cat-btn {
  flex: 0 0 auto;

  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.55);

.customer-menu-cat-btn:active,
.customer-menu-cat-btn:hover {

}

.customer-menu-main {

}

.customer-menu-section {

.customer-menu-cat {

.customer-menu-list {

}

.customer-menu-item {

.customer-menu-thumb {

}

.customer-menu-thumb img {

}

.customer-menu-thumb-ph {

}

.customer-menu-info {

.customer-menu-name {

.customer-menu-badge {

}

.customer-menu-footer {

<body class="customer-menu-body customer-menu-app">
  <header class="customer-menu-header">
    <div class="customer-menu-header-top">
      <div class="customer-menu-brand">
        <img src="./images/logo.png" alt="مطعم الريف" class="customer-menu-logo" width="72" height="72">
      </div>
      <div class="customer-menu-meta">
        <p class="customer-menu-subtitle">تطبيق السائق</p>
        <h1>مطعم الريف</h1>
      </div>
    </div>
  </header>
  <main class="customer-menu-main" style="padding:16px">
    <div id="drvLogin" class="menu-app-gate-box" style="height:auto;border-radius:16px;padding:20px">
      <label>رقم هاتفك كما في البرنامج</label>
      <input type="tel" id="drvPhone" dir="ltr" inputmode="tel" placeholder="07xxxxxxxxx">
      <button type="button" class="customer-menu-add" id="drvEnter">دخول</button>
    </div>
    <div id="drvJobs" hidden></div>
  </main>
  <script>
  (function () {
    function key(p) {
      var d = String(p || '').replace(/\D/g, '');
      if (d.indexOf('00') === 0) d = d.slice(2);
      if (d.indexOf('964') === 0 && d.length > 10) d = '0' + d.slice(3);
      if (d.charAt(0) === '7' && d.length === 10) d = '0' + d;
      return d;
    }
    var login = document.getElementById('drvLogin');
    var jobsEl = document.getElementById('drvJobs');
    var saved = '';
    try { saved = localStorage.getItem('yaiDriverPhone') || ''; } catch (e) {}
    function render(jobs) {
      if (!jobsEl) return;
      if (!jobs || !jobs.length) {
        jobsEl.innerHTML = '<p class="customer-menu-empty">لا توجد طلبيات جديدة</p>';
        return;
      }
      jobsEl.innerHTML = jobs.slice().reverse().map(function (j) {
        var map = j.map ? '<p><a href="' + j.map + '" target="_blank">فتح الموقع على الخريطة</a></p>' : '';
        return '<article class="y-ai-info-card">' +
          '<h2>فاتورة #' + (j.invoice || '') + '</h2>' +
          '<p>العنوان: ' + (j.address || '') + '</p>' +
          (j.phone ? '<p>هاتف الزبون: ' + j.phone + '</p>' : '') +
          (j.items ? '<p>' + j.items + '</p>' : '') +
          (j.total ? '<p>المبلغ: ' + j.total + '</p>' : '') +
          map + '</article>';
      }).join('');
    }
    function load(phone) {
      var k = key(phone);
      if (!k) return;
      fetch('./driver-inbox/' + k + '.json?t=' + Date.now())
        .then(function (r) { return r.ok ? r.json() : { jobs: [] }; })
        .then(function (d) { render((d && d.jobs) || []); })
        .catch(function () { render([]); });
    }
    var enter = document.getElementById('drvEnter');
    var phoneEl = document.getElementById('drvPhone');
    if (saved && phoneEl) phoneEl.value = saved;
    if (saved) {
      if (login) login.hidden = true;
      if (jobsEl) jobsEl.hidden = false;
      load(saved);
      setInterval(function () { load(saved); }, 8000);
    }
    if (enter) enter.addEventListener('click', function () {
      var p = phoneEl && phoneEl.value;
      if (key(p).length < 8) { alert('أدخل رقمك'); return; }
      try { localStorage.setItem('yaiDriverPhone', p); } catch (e) {}
      saved = p;
      if (login) login.hidden = true;
      if (jobsEl) jobsEl.hidden = false;
      load(p);
      setInterval(function () { load(p); }, 8000);
    });
  })();
  </script>
